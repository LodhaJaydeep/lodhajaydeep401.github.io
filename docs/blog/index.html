<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Blog — Portfolio</title>
    <meta name="description" content="Personal portfolio" />
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
      /* Minimal container width */
      .container { max-width: 1100px; margin: 0 auto; }
    </style>
  </head>
  <body class="bg-white dark:bg-gray-900 text-gray-900 dark:text-gray-100 antialiased">
    <header class="py-6 border-b border-gray-200 dark:border-gray-800">
      <div class="container px-6 flex items-center justify-between">
        <a href="/" class="font-semibold text-xl">Your Name</a>
        <nav class="space-x-4 text-sm">
          <a href="/">Home</a>
          <a href="/projects/">Projects</a>
          <a href="/blog/">Blog</a>
          <a href="/resume/">Resume</a>
        </nav>
      </div>
    </header>

    <main class="container px-6 py-10">
      
<h1 class="text-2xl font-semibold mb-6">Learning Log / Blog</h1>
<div class="space-y-4">
  
  <article class="p-4 border rounded">
    <a href="/blog/2026-05-22-first-post" class="text-lg font-medium">My First Post</a>
    <div class="text-sm text-gray-600 dark:text-gray-300">Welcome to my learning log. This site uses Markdown files as sources for blog posts — just drop a new `.md` file into `content/blogs/`.</div>
  </article>
  
</div>

    </main>

    <footer class="py-10 border-t border-gray-200 dark:border-gray-800">
      <div class="container px-6 text-sm text-center">©  Your Name — Built with Flask + Tailwind</div>
    </footer>
  </body>
  <script>
    // Set year for footer
    document.addEventListener('DOMContentLoaded', function(){
      const el = document.querySelector('footer div');
      if(el){ el.innerHTML = '© ' + new Date().getFullYear() + ' Your Name — Built with Flask + Tailwind'; }
    });
  </script>
</html>
