<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Resume — Portfolio</title>
    <meta name="description" content="Personal portfolio" />
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
      /* Minimal container width */
      .container { max-width: 1100px; margin: 0 auto; }
    </style>
  </head>
  <body class="bg-white dark:bg-gray-900 text-gray-900 dark:text-gray-100 antialiased">
    <header class="py-6 border-b border-gray-200 dark:border-gray-800">
      <div class="container px-6 flex items-center justify-between">
        <a href="/" class="font-semibold text-xl">Your Name</a>
        <nav class="space-x-4 text-sm">
          <a href="/">Home</a>
          <a href="/projects/">Projects</a>
          <a href="/blog/">Blog</a>
          <a href="/resume/">Resume</a>
        </nav>
      </div>
    </header>

    <main class="container px-6 py-10">
      
<h1 class="text-2xl font-semibold mb-4">Resume</h1>
<p class="mb-4">A clean online resume. Download as PDF below.</p>
<div class="mb-6">
  <a href="/static/resume.pdf" class="px-4 py-2 bg-indigo-600 text-white rounded" download>Download PDF</a>
  <a href="/static/resume.pdf" class="ml-3 text-sm" target="_blank">Open Viewer</a>
</div>
<div class="border rounded p-4 bg-white dark:bg-gray-800">
  <h2 class="font-medium">Your Name</h2>
  <p class="text-sm text-gray-600 dark:text-gray-300">Short professional summary goes here.</p>
  <h3 class="mt-4 font-semibold">Experience</h3>
  <ul class="list-disc ml-6 text-sm text-gray-600 dark:text-gray-300">
    <li>Role — Company (Year — Year)</li>
  </ul>
</div>

    </main>

    <footer class="py-10 border-t border-gray-200 dark:border-gray-800">
      <div class="container px-6 text-sm text-center">©  Your Name — Built with Flask + Tailwind</div>
    </footer>
  </body>
  <script>
    // Set year for footer
    document.addEventListener('DOMContentLoaded', function(){
      const el = document.querySelector('footer div');
      if(el){ el.innerHTML = '© ' + new Date().getFullYear() + ' Your Name — Built with Flask + Tailwind'; }
    });
  </script>
</html>
