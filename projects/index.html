<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Projects — Portfolio</title>
    <meta name="description" content="Personal portfolio" />
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
      /* Minimal container width */
      .container { max-width: 1100px; margin: 0 auto; }
    </style>
  </head>
  <body class="bg-white dark:bg-gray-900 text-gray-900 dark:text-gray-100 antialiased">
    <header class="py-6 border-b border-gray-200 dark:border-gray-800">
      <div class="container px-6 flex items-center justify-between">
        <a href="/" class="font-semibold text-xl">Your Name</a>
        <nav class="space-x-4 text-sm">
          <a href="/">Home</a>
          <a href="/projects/">Projects</a>
          <a href="/blog/">Blog</a>
          <a href="/resume/">Resume</a>
        </nav>
      </div>
    </header>

    <main class="container px-6 py-10">
      
<h1 class="text-2xl font-semibold mb-6">Projects</h1>
<div class="grid gap-6 sm:grid-cols-2 lg:grid-cols-3">
  
  <div class="p-4 border rounded bg-white dark:bg-gray-800">
    <h3 class="font-medium">Example Project</h3>
    <p class="text-sm text-gray-600 dark:text-gray-300">A minimal, fast example project showcasing responsive UI and a small footprint.</p>
    <div class="mt-3 flex gap-2 flex-wrap">
      
        <span class="text-xs px-2 py-1 border rounded">Flask</span>
      
        <span class="text-xs px-2 py-1 border rounded">Tailwind</span>
      
        <span class="text-xs px-2 py-1 border rounded">Markdown</span>
      
    </div>
    <div class="mt-3 flex gap-2">
      <a href="#" class="text-sm px-3 py-1 bg-indigo-600 text-white rounded">Live Demo</a>
      <a href="https://github.com/yourusername/example-project" class="text-sm px-3 py-1 border rounded">GitHub</a>
    </div>
  </div>
  
</div>

    </main>

    <footer class="py-10 border-t border-gray-200 dark:border-gray-800">
      <div class="container px-6 text-sm text-center">©  Your Name — Built with Flask + Tailwind</div>
    </footer>
  </body>
  <script>
    // Set year for footer
    document.addEventListener('DOMContentLoaded', function(){
      const el = document.querySelector('footer div');
      if(el){ el.innerHTML = '© ' + new Date().getFullYear() + ' Your Name — Built with Flask + Tailwind'; }
    });
  </script>
