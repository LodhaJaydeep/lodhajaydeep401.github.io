{% extends 'base.html' %}
{% block title %}Projects — Portfolio{% endblock %}
{% block content %}
<h1 class="text-2xl font-semibold mb-6">Projects</h1>
<div class="grid gap-6 sm:grid-cols-2 lg:grid-cols-3">
  {% for p in projects %}
  <div class="p-4 border rounded bg-white dark:bg-gray-800">
    <h3 class="font-medium">{{ p.title }}</h3>
    <p class="text-sm text-gray-600 dark:text-gray-300">{{ p.description }}</p>
    <div class="mt-3 flex gap-2 flex-wrap">
      {% for t in p.tech %}
        <span class="text-xs px-2 py-1 border rounded">{{ t }}</span>
      {% endfor %}
    </div>
    <div class="mt-3 flex gap-2">
      <a href="{{ p.live_url }}" class="text-sm px-3 py-1 bg-indigo-600 text-white rounded">Live Demo</a>
      <a href="{{ p.repo_url }}" class="text-sm px-3 py-1 border rounded">GitHub</a>
    </div>
  </div>
  {% endfor %}
</div>
{% endblock %}
