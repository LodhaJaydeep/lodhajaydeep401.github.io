{% extends 'base.html' %}
{% block title %}Blog — Portfolio{% endblock %}
{% block content %}
<h1 class="text-2xl font-semibold mb-6">Learning Log / Blog</h1>
<div class="space-y-4">
  {% for post in posts %}
  <article class="p-4 border rounded">
    <a href="/blog/{{ post.slug }}" class="text-lg font-medium">{{ post.title }}</a>
    <div class="text-sm text-gray-600 dark:text-gray-300">{{ post.excerpt }}</div>
  </article>
  {% endfor %}
</div>
{% endblock %}
